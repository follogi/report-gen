# Configurazione Sistema Generazione Relazioni Legali AI

# Percorsi dati
data:
  normative_dir: "/Users/gianluca/temp/scraper/output"
  esempi_dir: "data/esempi"
  template_dir: "data/template"
  output_dir: "data/output"
  sessions_dir: "data/sessions"

ollama:
  model: "mistral:latest"
  base_url: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 4096
  timeout: 120
  context_window: 8192

chromadb:
  persist_directory: "./vectordb"
  collection_normative: "normative_v1"
  collection_esempi_prefix: "session_"
  distance_metric: "cosine"

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  cache_dir: "./cache/embeddings"
  device: "cpu"  # Cambia in "cuda" se disponibile GPU

chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"  # Ottimizzato per articoli di legge
  metadata_mode: "all"

confidence:
  high_threshold: 0.8
  medium_threshold: 0.5
  min_acceptable: 0.3
  enable_highlighting: true

normative:
  base_url: "https://www.normattiva.it"
  api_endpoint: "/uri-res/N2Ls"
  timeout: 30
  max_retries: 3
  cache_enabled: true

retrieval:
  top_k: 5  # Numero di chunks da recuperare
  similarity_cutoff: 0.3
  rerank: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  max_file_size: 10485760  # 10 MB
  backup_count: 5

ui:
  theme: "light"
  max_upload_size_mb: 10
  max_esempi_files: 10
  show_debug_info: false

generation:
  enable_citations: true
  citation_format: "[N.{number}]"
  add_bibliography: true
  highlight_confidence: true
